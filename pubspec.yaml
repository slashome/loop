name: loop
description: "Loop — local-first personal task manager."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.0.0
  drift: ^2.34.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0
  path_provider: ^2.1.0
  path: ^1.9.0
  uuid: ^4.6.0
  shared_preferences: ^2.3.0
  google_fonts: ^8.0.0
  flutter_native_splash: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
